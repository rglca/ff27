<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111a17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Draftboard // 2026 PPR</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/draftboard-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/draftboard-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">//</div>
          <div>
            <p class="eyebrow">2026 fantasy football</p>
            <h1>Draftboard</h1>
          </div>
        </div>
        <div class="league-chip">FULL PPR <span>·</span> 10 teams</div>
      </header>

      <main>
        <section class="hero-grid controls-only">
          <div class="control-card card strategy-card">
            <div class="card-kicker">Strategy lens</div>
            <div class="strategy-toggle" role="group" aria-label="Draft strategy">
              <button class="seg-btn active" data-strategy="balanced">Balanced</button>
              <button class="seg-btn" data-strategy="wr-first">WR-first</button>
              <button class="seg-btn" data-strategy="rb-first">RB-first</button>
            </div>
          </div>
        </section>

        <section class="recommendation card" aria-live="polite">
          <div class="recommendation-label"><span class="pulse-dot"></span> On deck · pick <span id="current-pick">1</span></div>
          <div id="recommendation-content"></div>
        </section>

        <section class="draft-entry quick-add-card card">
          <div class="section-heading">
            <div>
              <div class="card-kicker">Draft tracker</div>
              <h3>Log a pick</h3>
            </div>
            <div class="draft-entry-actions">
              <span id="pick-count" class="muted-small">0 logged</span>
              <button id="undo-button" class="text-button" type="button" disabled>Undo</button>
            </div>
          </div>
          <form id="quick-add-form" class="quick-add-form">
            <label class="sr-only" for="player-input">Player drafted</label>
            <input id="player-input" list="player-suggestions" autocomplete="off" placeholder="Type a player name…" />
            <datalist id="player-suggestions"></datalist>
            <button class="primary-button" type="submit">Log drafted</button>
          </form>
          <div id="recent-picks" class="recent-picks"></div>
        </section>

        <section class="board-section">
          <div class="board-heading">
            <div>
              <div class="card-kicker">The board</div>
              <h3>Available players</h3>
              <p id="board-subtitle" class="muted-small">Sorted by draft score · injury adjusted</p>
            </div>
            <div class="board-actions">
              <button id="reset-button" class="text-button danger-text" type="button">Reset</button>
            </div>
          </div>

          <div class="view-tabs" role="tablist" aria-label="Board views">
            <button class="view-tab active" role="tab" aria-selected="true" data-view="board">Big board</button>
            <button class="view-tab" role="tab" aria-selected="false" data-view="adp">ADP</button>
            <button class="view-tab" role="tab" aria-selected="false" data-view="injuries">Injuries</button>
          </div>

          <div id="board-view" class="view-panel"></div>
          <div id="adp-view" class="view-panel hidden"></div>
          <div id="injuries-view" class="view-panel hidden"></div>
        </section>
      </main>

      <footer class="footer-note">
        <span>Refreshed Aug 31, 2026</span>
        <a href="SOURCES.md">Sources & methodology</a>
        <span>Save this page to your Home Screen</span>
      </footer>
    </div>

    <script src="data/players.js"></script>
    <script src="data/pool.js"></script>
    <script src="data/context.js"></script>
    <script src="data/updates.js"></script>
    <script src="app.js"></script>
  </body>
</html>
